<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Orbital Antigravity (Ciano -> Azul Elétrico -> Roxo) -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ce1e6" />
      <stop offset="50%" stop-color="#3279f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Brilho Central -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3279f9" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0a0b0f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Squircle Escura (#0a0b0f) para contraste perfeito em abas claras ou escuras -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0a0b0f" stroke="url(#orbitGrad)" stroke-width="2" />

  <!-- Halo Atmosférico Interno -->
  <circle cx="32" cy="32" r="24" fill="url(#coreGlow)" />

  <!-- Malha Pontilhada Sutil de Fundo -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Anel Orbital Inclinado (Vibe ASCII Cosmos + Teamwork Graph) -->
  <ellipse
    cx="32"
    cy="32"
    rx="22"
    ry="10"
    transform="rotate(-28 32 32)"
    fill="none"
    stroke="url(#orbitGrad)"
    stroke-width="2.4"
    stroke-dasharray="4 2.5"
  />

  <!-- Segunda Órbita Cruzada Sutil -->
  <ellipse
    cx="32"
    cy="32"
    rx="20"
    ry="8.5"
    transform="rotate(32 32 32)"
    fill="none"
    stroke="#749bff"
    stroke-opacity="0.35"
    stroke-width="1.4"
  />

  <!-- Estrela Central de 4 Pontas (Símbolo ✦ da Navbar do Site) -->
  <path
    d="M32 14 C33.2 25.5 38.5 30.8 50 32 C38.5 33.2 33.2 38.5 32 50 C30.8 38.5 25.5 33.2 14 32 C25.5 30.8 30.8 25.5 32 14 Z"
    fill="#f8f9fc"
  />

  <!-- Nós Conectados do Grafo nos Cantos da Órbita -->
  <circle cx="13" cy="42" r="3" fill="#5ce1e6" />
  <circle cx="51" cy="22" r="3" fill="#a855f7" />
  <circle cx="46" cy="44" r="2.3" fill="#f5c400" />
  <circle cx="18" cy="20" r="2.3" fill="#3279f9" />
</svg>
